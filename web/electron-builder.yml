# electron-builder configuration
# https://www.electron.build/configuration/configuration

appId: com.thirdspace.vest
productName: Third Space Vest
copyright: Copyright © 2024 Third Space Vest Contributors

# Directories (output is overridden by build-release.bat / electron-pack-win.mjs / build-release.mjs)
directories:
  output: release
  buildResources: build

# Files to include in the app
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
  # Exclude dev files
  - "!**/*.map"
  - "!**/node_modules/.cache"
  # Exclude daemon from asar (it goes to extraResources)
  - "!dist/daemon/**/*"

# Extra resources (copied to resources folder, not asar)
# NOTE: Build the daemon first! (python modern-third-space/build/build-daemon.py)
extraResources:
  # The daemon executable (built by PyInstaller)
  # On Windows: vest-daemon.exe, on Linux/macOS: vest-daemon
  - from: "dist/daemon/vest-daemon.exe"
    to: "daemon/vest-daemon.exe"
  
  # =========================================================================
  # Bundled Game Mods
  # These are pre-built mod files that users can download/install from the UI
  # =========================================================================
  
  # L4D2 VScript mod files (auto-install from UI): every *.nut in vscripts (haptics + coop/versus/survival/scavenge)
  - from: "../misc-documentations/bhaptics-svg-24-nov/l4d2/third-space-vest-mod/scripts/vscripts/"
    to: "mods/l4d2/"
    filter:
      - "*.nut"
  
  # Half-Life: Alyx (README only - mod from NexusMods)
  - from: "../mods/alyx/"
    to: "mods/alyx/"
    filter:
      - "*.lua"
      - "README.md"

  # Pistol Whip MelonLoader DLL (built ThirdSpace_PistolWhip.dll, plus README)
  - from: "../mods/pistolwhip/"
    to: "mods/pistolwhip/"
    filter:
      - "*.dll"
      - "README.md"

  # Battle Sister MelonLoader DLL (built ThirdSpace_BattleSister.dll, plus README)
  - from: "../mods/battlesister/"
    to: "mods/battlesister/"
    filter:
      - "*.dll"
      - "README.md"

  # Gunman Contracts MelonLoader DLL (built ThirdSpace_GunmanContracts.dll, plus README)
  - from: "../mods/gunmancontracts/"
    to: "mods/gunmancontracts/"
    filter:
      - "*.dll"
      - "README.md"

# Don't pack into asar (easier debugging, daemon access)
asar: true
asarUnpack:
  - "electron/**/*"

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Icon for Windows executable and installer
  # web/build/ is gitignored; icons live under public/
  icon: public/icon.ico
  # Request admin rights if needed for USB access
  requestedExecutionLevel: asInvoker
  # Disable code signing / exe editing (avoids winCodeSign symlink privilege errors on Windows).
  # Icon is applied separately via afterPack (scripts/afterPack-win-icon.mjs).
  sign: null
  signDlls: false
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  signingHashAlgorithms: []

# Apply .exe icon without enabling signAndEditExecutable / winCodeSign
afterPack: scripts/afterPack-win-icon.mjs

# NSIS installer configuration  
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # Icons for NSIS installer
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeaderIcon: public/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Third Space Vest
  # License file (optional)
  # license: LICENSE.txt
  
# Portable version (no installer, just zip)
portable:
  artifactName: "${productName}-${version}-portable.zip"

# Publish configuration (for auto-updates)
# Uncomment and configure when ready for releases
# publish:
#   provider: github
#   owner: YourGitHubUsername
#   repo: libthirdspacevest-simhub

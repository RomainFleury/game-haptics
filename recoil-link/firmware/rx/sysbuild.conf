# Partition Manager links this app at flash address 0 while UF2 generation
# still uses the devicetree code-partition offset (0x26000 or 0x1000).
# The file then lands in the right slot with a reset vector that jumps into
# the SoftDevice or MBR and hardfaults before main.
# Keep the link address equal to that partition offset.
SB_CONFIG_PARTITION_MANAGER=n

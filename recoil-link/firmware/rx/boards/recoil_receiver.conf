# Applied only for board recoil_receiver (SoftDevice slot), not the nosd board.
# Flash layout is the DTS code partition. Partition Manager is disabled in
# sysbuild.conf — a pm_static yml cannot fix a UF2 whose reset vector was linked at 0.

# Disable S140 before BSS clear. common/softdevice_release.c provides soc_reset_hook().
CONFIG_SOC_RESET_HOOK=y

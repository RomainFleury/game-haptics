# SoftDevice-slot board: USB CDC like CircuitPython so boot failures are visible.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_MANUFACTURER="ThunderStrikeCompany"
CONFIG_USB_DEVICE_PRODUCT="TSC Recoil Link RX"
CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x80B5

# Disable S140 in soc_reset_hook(), before BSS clear and before Zephyr
# raises BASEPRI. See common/softdevice_release.c.
CONFIG_SOC_RESET_HOOK=y
